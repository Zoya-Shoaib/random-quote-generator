<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
       * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

html, body { min-height: 100%; }

/* Background image + overlay stay fixed behind the content */
body > img {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
}
.overlay {
  position: fixed;
  inset: 0;
  background: #0b122566;
  z-index: 2;
}

/* Layout: grows with content, scrolls if the screen is short */
.quote-generator {
  position: relative;
  z-index: 3;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(24px, 6vw, 80px);
  padding: 24px;
}

.qg-1 {
  flex: 1 1 0;
  max-width: 480px;
  color: #fff;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.qg-1 h1 {
  font-size: clamp(26px, 4vw, 38px);
  font-weight: 500;
  line-height: 1.2;
}
.qg-1 h4 {
  color: #03c3c3;
  font-size: clamp(15px, 1.6vw, 18px);
  font-weight: 450;
  line-height: 1.5;
}

.qg-2 {
  flex: 1 1 0;
  max-width: 480px;
  background: #fff;
  border: 1px solid #03c3c3;
  border-radius: 24px;
  box-shadow: 0 0 16px #03c3c3;
  padding: 32px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
}
.qg-2 h2 {
  width: 80%;
  padding-bottom: 8px;
  border-bottom: 3px solid #03c3c3;
  font-size: clamp(20px, 2.4vw, 28px);
  color: #012b87;
}

#quote {
  font-size: clamp(16px, 1.6vw, 18px);
  font-weight: 450;
  line-height: 1.6;
  color: #012b87;
  overflow-wrap: anywhere;
}
#author {
  font-size: 14px;
  font-weight: 450;
  color: #03c3c3;
}

#btn {
  align-self: flex-end;
  min-height: 44px;
  padding: 10px 24px;
  border: 3px solid #03c3c3;
  border-radius: 30px;
  background-color: #012b87;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}
#btn:hover {
  background-color: #03c3c3;
  border-color: #012b87;
}

/* Tablet + mobile: stack vertically */
@media (max-width: 768px) {
  .quote-generator {
    flex-direction: column;
    gap: 24px;
    padding: 32px 16px;
  }
  .qg-1,
  .qg-2 {
    flex: none;
    width: 100%;
    max-width: 420px;
  }
  .qg-2 { padding: 28px 20px; }
  #btn {
    align-self: stretch;   /* full-width, easy to tap */
    font-size: 16px;
  }
}
    </style>
</head>
<body>
    <img src="https://static.vecteezy.com/system/resources/previews/001/987/748/non_2x/abstract-template-blue-geometric-diagonal-overlap-layer-on-dark-blue-background-free-vector.jpg" alt="">
    <div class="overlay"></div>
    <div class="quote-generator">
        <div class="qg-1">
            <h1>RANDOM QUOTE GENERATOR</h1>
            <h4>Quotes that inspire, motivate, and make you think...</h4>
        </div>
        <div class="qg-2">
            <h2 class="head">RANDOM QUOTE</h2>
             <h4 id="quote">A little inspiration is one click away…</h4>
            <h6 id="author"><i>— Author Name —</i></h6>
            <button id="btn">Generate Quote</button>
        </div>
    </div>
    <script src="./assets/js/script.js"></script>
</body>
</html>
